<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Chat-Vala — Chat with Email</title>
    <meta name="description" content="Chat-Vala is a WhatsApp-like chat app that works with your email. No phone number needed.">
    <link rel="icon" type="image/png" href="iconr.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            background: linear-gradient(160deg, #075E54 0%, #128C7E 40%, #25D366 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            overflow: hidden;
        }

        /* --- Loading Overlay --- */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(160deg, #075E54 0%, #128C7E 40%, #25D366 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.5s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* --- Landing Content --- */
        .landing {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 40px 24px;
            text-align: center;
            animation: fadeUp 0.8s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .app-icon {
            width: 110px;
            height: 110px;
            border-radius: 28px;
            object-fit: cover;
            margin-bottom: 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            animation: iconFloat 5s ease-in-out infinite;
        }

        @keyframes iconFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .app-name {
            font-size: 34px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 10px;
        }

        .tagline {
            font-size: 15px;
            opacity: 0.85;
            max-width: 300px;
            line-height: 1.6;
            margin-bottom: 44px;
        }

        /* --- Google Sign-In Button --- */
        .google-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            background: white;
            color: #111B21;
            border: none;
            padding: 14px 32px;
            border-radius: 999px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18);
            transition: all 0.25s ease;
        }

        .google-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 32px rgba(0, 0, 0, 0.25);
        }

        .google-btn:active {
            transform: translateY(0) scale(0.98);
        }

        .google-btn svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        /* --- Feature Chips --- */
        .features {
            display: flex;
            gap: 12px;
            margin-top: 44px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .chip {
            background: rgba(255, 255, 255, 0.14);
            backdrop-filter: blur(10px);
            padding: 8px 18px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.18);
            animation: fadeUp 0.8s ease both;
        }

        .chip:nth-child(1) { animation-delay: 0.2s; }
        .chip:nth-child(2) { animation-delay: 0.35s; }
        .chip:nth-child(3) { animation-delay: 0.5s; }

        /* --- Footer --- */
        footer {
            padding: 20px;
            text-align: center;
            font-size: 12px;
            opacity: 0.55;
        }

        footer a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
        }

        /* --- Desktop --- */
        @media (min-width: 768px) {
            .app-icon { width: 130px; height: 130px; border-radius: 32px; }
            .app-name { font-size: 44px; }
            .tagline { font-size: 17px; max-width: 380px; }
        }
    </style>
</head>

<body>
    <div class="loading-overlay" id="loader">
        <div class="spinner"></div>
    </div>

    <div class="landing">
        <img src="iconr.png" alt="Chat-Vala" class="app-icon">
        <h1 class="app-name">Chat-Vala</h1>
        <p class="tagline">Simple conversations, powered by your email. No phone number needed.</p>

        <button class="google-btn" id="signInBtn" onclick="googleSignIn()">
            <svg viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Continue with Google
        </button>

        <div class="features">
            <span class="chip">📧 Email-based</span>
            <span class="chip">🔒 Private</span>
            <span class="chip">⚡ Real-time</span>
        </div>
    </div>

    <footer>
        <a href="#">About</a>
        <a href="#">Privacy</a>
        <a href="#">Contact</a>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBM7RX6ruJoA5QeOG78briw2sjxgvnqLqc",
            authDomain: "chat-vala.firebaseapp.com",
            projectId: "chat-vala",
            storageBucket: "chat-vala.firebasestorage.app",
            messagingSenderId: "134314086464",
            appId: "1:134314086464:web:b06ab2548270ebbf8f8fa5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // Ensure user document exists with all required fields
        async function ensureUserDoc(user) {
            const ref = doc(db, "users", user.uid);
            const snap = await getDoc(ref);
            if (!snap.exists()) {
                const uid = "CV-" + Math.random().toString(36).substring(2, 8).toUpperCase();
                await setDoc(ref, {
                    name: user.displayName || "User",
                    email: user.email,
                    photoURL: user.photoURL || "",
                    uniqueId: uid,
                    friends: [],
                    online: true,
                    about: "Hey there! I am using Chat-Vala",
                    lastSeen: null,
                    createdAt: new Date()
                });
            }
        }

        // Redirect logged-in users
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                await ensureUserDoc(user);
                window.location.replace("dashboard.html");
            } else {
                document.getElementById("loader").classList.add("hidden");
            }
        });

        // Google Sign-In
        window.googleSignIn = async () => {
            const btn = document.getElementById("signInBtn");
            btn.disabled = true;
            btn.style.opacity = "0.7";
            btn.innerHTML = '<div class="spinner" style="width:18px;height:18px;border-width:2px;"></div> Signing in...';
            try {
                const result = await signInWithPopup(auth, provider);
                await ensureUserDoc(result.user);
                window.location.replace("dashboard.html");
            } catch (err) {
                console.error(err);
                btn.disabled = false;
                btn.style.opacity = "1";
                btn.innerHTML = `<svg viewBox="0 0 24 24" style="width:20px;height:20px"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg> Continue with Google`;
                alert("Sign-in failed. Please try again.");
            }
        };
    </script>
</body>

</html>
